<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VHD USB Downloader</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <img src="./icon.png" alt="App Icon" class="app-icon" />
            <div class="app-title">
                <h1>vhdusbdownloader</h1>
                <p class="subtitle">Download VHD files directly to USB drives</p>
            </div>
        </header>

        <main class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <label for="url">File URL</label>
                    <div class="input-with-icon">
                        <input type="text" id="url" placeholder="https://example.com/file.vhd" />
                        <span class="input-icon">🔗</span>
                    </div>
                </div>
                <div class="input-group horizontal-group">
                    <label for="dest">Destination USB Drive</label>
                    <div class="horizontal-input">
                        <div class="input-with-icon" style="flex:1;">
                            <input type="text" id="dest" placeholder="Select destination folder" readonly />
                            <span class="input-icon">📁</span>
                            <button id="select-dest" class="browse-btn"></button>
                        </div>
                        <button id="start" class="download-btn">
                            <svg class="download-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 16L7 11L8.4 9.55L11 12.15V4H13V12.15L15.6 9.55L17 11L12 16Z"
                                    fill="currentColor" />
                                <path d="M5 20H19V18H5V20Z" fill="currentColor" />
                            </svg>
                            Download
                        </button>
                    </div>
                </div>
            </div>
            <div class="log-section">
                <div class="log-header">
                    <label>Activity Log</label>
                    <div>
                        <button class="clear-log" id="vmc">VMC</button>
                        <button class="clear-log" id="stop" disabled>Stop</button>
                        <button class="clear-log" id="clear">Clear</button>
                    </div>
                </div>
                <div class="log-container" id="log-container">
                    <pre id="log">Ready to download...</pre>
                </div>
            </div>
        </main>
        <footer class="app-footer">
            <div class="progress-section">
                <div class="progress-header">
                    <label>Download Progress</label>
                    <span id="progress-text">0%</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
